<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superhero Search</title>

    <!-- styles for the page -->
    <link rel="stylesheet" href="styles.css">

    <!-- script is in the head so app.js waits for DOMContentLoaded -->
    <script src="app.js"></script>
</head>
<body>

    <!-- main box that holds everything -->
    <main class="container">

        <h1>Superhero Search</h1>

        <!-- search form - text field and button -->
        <form id="search-form">
            <label for="search">Search by name or alias</label>
            <input type="text" id="search" name="search" placeholder="e.g. Ironman or Tony Stark">
            <button type="submit" class="btn">Search</button>
        </form>

        <!-- the results from superheroes.php go in here -->
        <div id="result"></div>

    </main>

</body>
</html>
